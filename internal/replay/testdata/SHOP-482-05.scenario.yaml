apiVersion: semar/v1
kind: Scenario
id: SHOP-482-05
title: A new order can be read back
ticket: SHOP-482
intent: >
  A new order is readable by its owner, with the status created.
surface: api
authProfile: support-agent
given:
  - fixture: order.new
    as: order
steps:
  - id: read-order
    action: Read the order that the fixture made
    hint: { method: GET, path: "/v1/orders/{id}" }
    expect:
      - check: { status: 200 }
        source: ticket
        cite: "SHOP-482: the owner can read a new order"
      - check: { jsonpath: "$.data.status", equals: created }
        source: ticket
        cite: "SHOP-482: a new order has the status created"
