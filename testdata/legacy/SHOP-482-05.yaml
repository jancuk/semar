apiVersion: semar/v1
kind: Scenario
id: SHOP-482-05
title: A paid order is read back as paid
ticket: SHOP-482
intent: >
  Given a paid order, its owner reads it and sees the status paid and the amount that was paid.
surface: api
authProfile: support-agent
given:
  - fixture: order.paid
    as: order
steps:
  - id: read-paid-order
    action: Read the paid order
    hint: { method: GET, path: "/v1/orders/{id}" }
    expect:
      - check: { status: 200 }
        source: ticket
        cite: "SHOP-482: a paid order can be read by its owner"
      - check: { jsonpath: "$.data.status", equals: paid }
        source: ticket
        cite: "SHOP-482: the order stays paid"
      - check: { jsonpath: "$.data.amount", equals: 1000 }
        source: ticket
        cite: "SHOP-482: the paid amount is the order amount"
